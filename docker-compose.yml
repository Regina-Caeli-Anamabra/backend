---
services:
  mysql_db:
    image: mysql:8.3
    container_name: hms_db_mysql
    restart: unless-stopped
    ports:
      - 3355:3306
    environment:
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_ROOT_PASSWORD=${DB_MASTER_PASSWORD}
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - CONTAINER_ROLE=app
    volumes:
      - db-data:/var/lib/mysql
      - ~/php.ini:/usr/local/etc/php/php.ini
      - ./mysqld.cnf:/etc/mysql/mysql.conf.d/mysqld.cnf

  backend:
    build:
      context: .
      target: php
    container_name: regina_laravel_app
    environment:
      - APP_ENV="${APP_ENV}"
      - DB_DATABASE=${DB_DATABASE}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - CONTAINER_ROLE=app
    working_dir: /app
    ports:
      - 8030:8000
    depends_on:
      - mysql_db

  queue-worker:
      build:
          context: .
          target: php
      container_name: laravel_queue_worker
      environment:
          - APP_ENV="${APP_ENV}"
          - DB_DATABASE=${DB_DATABASE}
          - DB_PASSWORD=${DB_PASSWORD}
          - DB_USERNAME=${DB_USERNAME}
          - CONTAINER_ROLE=queue
      working_dir: /app
      depends_on:
          - mysql_db
          - backend
      command: php artisan queue:work --sleep=3 --tries=3 --timeout=120
      mem_limit: 1g
      volumes:
          - .:/app
      restart: always


  phpmyadmin:
      image: phpmyadmin
      restart: always
      ports:
          - 9000:80
      environment:
          - PMA_ARBITRARY=1
          - UPLOAD_LIMIT= 100000000
      depends_on:
          - mysql_db
volumes:
  db-data: null

