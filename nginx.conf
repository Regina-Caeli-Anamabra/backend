server {
    listen 80;
    server_name backend.reginacaelihospital.org.ng;

    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name backend.reginacaelihospital.org.ng;

    # SSL certificate files (replace with your actual cert files)
    ssl_certificate /etc/letsencrypt/live/backend.reginacaelihospital.org.ng/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.reginacaelihospital.org.ng/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Set maximum upload size (adjust as needed)
    client_max_body_size 100M;

    # Document root and index files (may not be necessary for API)
    root /var/www/backend.reginacaelihospital.org.ng;
    index index.html index.htm;

    # Reverse proxy settings
    location / {
        proxy_pass http://app:9000;  # Use the name of the app container and the exposed PHP-FPM port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Access and error logging
    access_log /var/log/nginx/backend.reginacaelihospital.org.ng_access.log;
    error_log /var/log/nginx/backend.reginacaelihospital.org.ng_error.log;
}
